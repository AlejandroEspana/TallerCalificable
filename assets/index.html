<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Libre - Clon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <img src="assets/logo-mercadolibre.png" alt="Mercado Libre">
        </div>
        <div class="location">
            <span>Ingresa tu ubicación</span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar productos, marcas y más...">
            <button id="searchBtn">🔍</button>
        </div>
        <ul class="nav-links">
            <li>Categorías</li>
            <li>Ofertas</li>
            <li>Supermercado</li>
            <li>Moda</li>
            <li>Vender</li>
            <li>Ayuda / PQR</li>
        </ul>
        <div class="user-actions">
            <span>Crea tu cuenta</span>
            <span>Ingresa</span>
            <span>Mis compras</span>
            <span>🛒</span>
        </div>
    </nav>
    <!-- Banner principal -->
    <section class="main-banner">
        <div class="banner-content">
            <h1>Descuentos premium <span>50% DCTO</span></h1>
            <p>Hasta 12 cuotas 0% interés</p>
        </div>
        <div class="banner-products">
            <img src="assets/treadmill.png" alt="Caminadora">
            <img src="assets/fridge.png" alt="Nevera">
        </div>
    </section>

  
    <!-- Sección de productos destacados -->
    <section class="featured-products">
        <h2>Productos Destacados</h2>
        <div class="products-grid" id="productsGrid">
            <!-- Productos generados por JS -->
        </div>
    </section>
</body>
